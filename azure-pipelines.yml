trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: databricks

stages:
  - stage: Validate
    displayName: Validate source
    jobs:
      - job: ValidateYamlAndPython
        displayName: Validate YAML and Python
        steps:
          - checkout: self
          - script: |
              python -m compileall -q src
            displayName: Compile Python sources
          - script: |
              test -f databricks.yml
            displayName: Confirm Databricks bundle configuration exists
  - stage: DeployDevelopment
    displayName: Deploy to Databricks development
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    
    jobs:
    - job: DeployBundle
      steps:
        - checkout: self
        - script: |
            curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            databricks bundle validate --target development
            databricks bundle deploy --target development
            databricks bundle run customer_metrics_job --target development
          displayName: Validate, deploy, and run the Databricks bundle
          env:
            DATABRICKS_HOST: $(DATABRICKS_HOST)
            DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
            DATABRICKS_CLIENT_ID: ${DATABRICKS_CLIENT_ID}
            DATABRICKS_ACCOUNT_ID: ${DATABRICKS_ACCOUNT_ID}
